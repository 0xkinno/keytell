name: Live checks
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Zero keys, code hash, claim and hashes against the chain (no keys)
        run: npx tsx scripts/verify.ts
      - name: The live app answers
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx tsx scripts/reachability.ts
