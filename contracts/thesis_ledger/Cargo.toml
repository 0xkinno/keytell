[package]
name = "thesis_ledger"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Keytell thesis ledger: a claim, its metric definitions, threshold and the hashes of its method and SQL, fixed on NEAR before the test data exists; observations posted by a function-call key; resolution by anyone"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
proptest = "1"
near-workspaces = "=0.22.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
